<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build and track campaign leaders for Malifaux Fourth Edition campaign mode, with a talkative Emissary for company." />
    <meta name="theme-color" content="#17110c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rye is the peddler's signboard and is used only for the wordmark.
         Alegreya carries every heading and every line of body text; it is a
         warm literary serif with enough weight range to hold hierarchy on its
         own. Courier Prime stays because a ledger really is typewritten. -->
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Installable. The worker that backs this is public/sw.js; read its
         header before touching it, because it must never cache /api/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hearthside" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Hodgepodge Hearthside — An Emissary's Campfire Wisecracks for Campaign Play</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      The service worker is registered HERE, in the document, and not in the
      app bundle. That is deliberate and it is load-bearing.

      Until v0.19.3 it was registered from `src/main.jsx`. A worker bug that
      poisoned the asset cache then stopped the bundle from loading at
      all — so the registration inside it never ran, the browser never checked
      for a new worker, and the *fixed* worker could not reach the browsers that
      needed it. The app was a white screen with no route back to a working
      state. A registration that only runs when the app already works cannot
      repair an app that does not.

      `updateViaCache: 'none'` makes the browser fetch `/sw.js` from the network
      rather than its HTTP cache, so a fix always gets seen.

      Localhost is excluded: `npm run dev` serves `public/` too, and a worker in
      front of the dev server caches whatever Vite happened to be serving, which
      is the classic way to spend an afternoon on a stale bundle. Failure is
      silent — the app works perfectly well without a worker.
    -->
    <script>
      (function () {
        var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1
        if (!('serviceWorker' in navigator) || local) return
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(function (reg) { return reg.update() })
            .catch(function () {})
        })
      })()
    </script>

    <!--
      Last resort: an app that cannot boot at all.

      `ErrorBoundary` catches a render that throws, which is a luxury that
      assumes React started. Nothing covered the case where the bundle itself
      never arrives — and that is exactly what a poisoned cache produced. This
      notices an empty root, clears the two things that can cause it, and
      reloads once.

      Guarded to a single attempt per tab via sessionStorage, because a reload
      loop on a broken deploy would be worse than the white screen it is trying
      to cure. If one attempt does not fix it, the page stays blank and the
      problem is a real one worth seeing.
    -->
    <script>
      (function () {
        var TRIED = 'hh:boot-recovery'
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.childNodes.length > 0) return
            try {
              if (sessionStorage.getItem(TRIED)) return
              sessionStorage.setItem(TRIED, String(Date.now()))
            } catch (e) { return }
            var done = function () { location.reload() }
            var jobs = []
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }))
            }
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }))
            }
            Promise.all(jobs).then(done, done)
          }, 5000)
        })
      })()
    </script>
  </body>
</html>
