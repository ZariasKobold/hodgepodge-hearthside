<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hank, the Hodgepodge Emissary, in his wide hat, with Henrietta looking over his shoulder">
  <title>Hank and Henrietta</title>
  <defs>
    <radialGradient id="hp-fire" cx="50%" cy="96%" r="86%">
      <stop offset="0%"   stop-color="#ffcf8a"/>
      <stop offset="24%"  stop-color="#f0a04b"/>
      <stop offset="52%"  stop-color="#b9601f"/>
      <stop offset="78%"  stop-color="#5d2f0d"/>
      <stop offset="100%" stop-color="#241206"/>
    </radialGradient>
    <clipPath id="hp-clip"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>

  <g clip-path="url(#hp-clip)">
    <circle cx="60" cy="60" r="60" fill="url(#hp-fire)"/>

    <!-- Henrietta, behind his left shoulder. A shade lighter than Hank so the
         two silhouettes separate instead of merging into one mass. -->
    <g fill="#2b1a0a">
      <path d="M14.5 62.2c-2.6-6.6-3.6-12.2-3-16.7.4-3.1 2.2-3.4 4.3-.9 3.1 3.7 5.2 9.3 6.2 16.8z"/>
      <path d="M24.8 60.4c-.4-7.1.6-12.8 2.9-17.1 1.6-3 3.4-2.7 4.3.7 1.3 4.9 1.2 11-.4 18.2z"/>
      <path d="M33.6 120c-2.6-13.9-5.6-24.5-9-31.8-2.4-5.2-5.6-9.6-9.5-13.2-3.6-3.3-5-6.7-4.1-10 .9-3.4 3.6-4.4 8-3 4.4 1.4 7.9 4.4 10.4 8.9 2.2 3.9 5 6.9 8.4 8.9 6.2 3.7 10.3 8.7 12.3 15.1 1.6 5.1 2.6 13.5 3 25.1z"/>
    </g>

    <!-- Hank. Body, head and hat overlap into one continuous mass; a
         backlit figure has no internal edges. -->
    <g fill="#100a04">
      <path d="M26 120c1-18.6 5.4-31 13.2-37.2 5.4-4.3 12.3-6.4 20.8-6.4s15.4 2.1 20.8 6.4C88.6 89 93 101.4 94 120z"/>
      <ellipse cx="60" cy="70" rx="11.2" ry="13"/>
      <path d="M48.6 64c-1-10.6.2-18.2 3.6-22.8 2.2-3 5-4.5 8.4-4.5s6.2 1.5 8.4 4.5c3.4 4.6 4.6 12.2 3.6 22.8z"/>
      <path d="M27.4 63.6c8.4-5.2 19.3-7.8 32.6-7.8s24.2 2.6 32.6 7.8c2.7 1.6 2.3 3.6-1.2 5.3-4.3 2.2-9.6 3.8-15.9 4.8-1.1-2-2.6-3.5-4.4-4.4-3.6 1-7.3 1.5-11.1 1.5s-7.5-.5-11.1-1.5c-1.8.9-3.3 2.4-4.4 4.4-6.3-1-11.6-2.6-15.9-4.8-3.5-1.7-3.9-3.7-1.2-5.3z"/>
      <!-- the pack strap that says he carries everything he owns -->
      <path d="M50.4 84.6l9.4-5.6 3.4 6.2-9.8 5.8z" fill="#241408"/>
    </g>
  </g>
  <circle cx="60" cy="60" r="59" fill="none" stroke="#d9ab52" stroke-width="1.6" opacity=".7"/>
</svg>
